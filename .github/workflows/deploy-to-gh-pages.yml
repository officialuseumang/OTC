name: Deploy to opentechcommunity gh-pages

on:
  push:
    branches:
      - main   # trigger only when main is updated
  workflow_dispatch:

concurrency:
  group: deploy-opentechcommunity-gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'ctpl-git/ctpl-sys-site-opentechcommunity' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Deploy to target gh-pages branch
        env:
          TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
          SOURCE_REPO: ctpl-git/ctpl-sys-site-opentechcommunity
          TARGET_REPO: opentechcommunity/opentechcommunity.github.io
        run: |
          set -euo pipefail

          if [ -z "$TARGET_REPO_TOKEN" ]; then
            echo "TARGET_REPO_TOKEN is not set"
            exit 1
          fi

          if [ "${GITHUB_REPOSITORY}" != "$SOURCE_REPO" ]; then
            echo "Refusing to deploy from unexpected source repository: ${GITHUB_REPOSITORY}"
            exit 1
          fi

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Refusing to deploy from unexpected source ref: ${GITHUB_REF}"
            exit 1
          fi

          echo "::add-mask::$TARGET_REPO_TOKEN"

          git config --local user.name "github-actions"
          git config --local user.email "actions@github.com"

          # Remove checkout's default github.com auth header so PAT in remote URL is used.
          git config --local --unset-all http.https://github.com/.extraheader || true

          # Add target repo
          git remote remove target 2>/dev/null || true
          git remote add target https://x-access-token:${TARGET_REPO_TOKEN}@github.com/${TARGET_REPO}.git
          git ls-remote --exit-code target HEAD >/dev/null

          # Push current checked-out ref (main) -> gh-pages with lease protection.
          if git ls-remote --exit-code --heads target gh-pages >/dev/null 2>&1; then
            git push target HEAD:gh-pages --force-with-lease=gh-pages --porcelain
          else
            git push target HEAD:gh-pages --porcelain
          fi