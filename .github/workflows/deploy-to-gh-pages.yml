name: Deploy to opentechcommunity gh-pages

on:
  push:
    branches:
      - main   # trigger only when main is updated

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy to target gh-pages branch
        env:
          TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          if [ -z "$TARGET_REPO_TOKEN" ]; then
            echo "TARGET_REPO_TOKEN is not set"
            exit 1
          fi

          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          # Remove checkout's default github.com auth header so PAT in remote URL is used.
          git config --local --unset-all http.https://github.com/.extraheader || true

          # Add target repo
          git remote add target https://x-access-token:${TARGET_REPO_TOKEN}@github.com/opentechcommunity/opentechcommunity.github.io.git

          # Push current checked-out ref (main) → gh-pages
          git push target HEAD:gh-pages --force