name: Deploy to opentechcommunity gh-pages

on:
  push:
    branches:
      - main   # trigger only when main is updated

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy to target gh-pages branch
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          # Remove checkout's default github.com auth header so PAT in remote URL is used.
          git config --local --unset-all http.https://github.com/.extraheader || true

          # Add target repo
          git remote add target https://x-access-token:${{ secrets.TARGET_REPO_TOKEN }}@github.com/opentechcommunity/opentechcommunity.github.io.git

          # Push main → gh-pages
          git push target main:gh-pages --force