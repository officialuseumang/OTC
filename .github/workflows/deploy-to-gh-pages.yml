name: Sync to opentechcommunity gh-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sync-gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'ctpl-git/ctpl-sys-site-opentechcommunity'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Push to target gh-pages
        env:
          TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          TARGET_REPO: opentechcommunity/opentechcommunity.github.io
        run: |
          set -euo pipefail

          if [ -z "$TARGET_REPO_TOKEN" ]; then
            echo "Missing TARGET_REPO_TOKEN"
            exit 1
          fi

          echo "::add-mask::$TARGET_REPO_TOKEN"

          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          # Remove default auth so PAT is used
          git config --global --unset-all http.https://github.com/.extraheader || true

          # Add target repo
          git remote remove target 2>/dev/null || true
          git remote add target https://x-access-token:${TARGET_REPO_TOKEN}@github.com/${TARGET_REPO}.git

          # Retry push logic
          max_attempts=3
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Attempt $attempt..."

            # Fetch remote branch (avoids stale push issues)
            git fetch target gh-pages || true

            if git ls-remote --exit-code --heads target gh-pages >/dev/null 2>&1; then
              if git push target HEAD:gh-pages --force; then
                echo "Push successful"
                break
              fi
            else
              if git push target HEAD:gh-pages; then
                echo "Initial push successful"
                break
              fi
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Push failed after $max_attempts attempts"
              exit 1
            fi

            sleep $((5 * attempt))
            attempt=$((attempt + 1))
          done