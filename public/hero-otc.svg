<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Open Tech Community hero illustration">
  <defs>
    <linearGradient id="gHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E11D48"/>
      <stop offset="0.55" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="gHero2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F172A" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="800" rx="22" fill="#FFF7F7"/>
  <path d="M 0 520 C 240 420, 420 720, 660 610 C 900 500, 980 320, 1200 360 L 1200 800 L 0 800 Z" fill="url(#gHero)" opacity="0.18"/>
  <path d="M 0 220 C 220 160, 390 310, 560 260 C 760 200, 900 40, 1200 120 L 1200 0 L 0 0 Z" fill="url(#gHero)" opacity="0.12"/>

  <g filter="url(#blur)" opacity="0.8">
    <circle cx="330" cy="300" r="120" fill="#E11D48" opacity="0.20"/>
    <circle cx="820" cy="240" r="160" fill="#F97316" opacity="0.18"/>
    <circle cx="760" cy="560" r="180" fill="#FB7185" opacity="0.18"/>
  </g>

  <g opacity="0.9">
    <rect x="190" y="230" width="820" height="380" rx="18" fill="#FFFFFF" stroke="#F1C5C7"/>
    <rect x="230" y="270" width="360" height="18" rx="9" fill="#111827" opacity="0.10"/>
    <rect x="230" y="305" width="520" height="12" rx="6" fill="#111827" opacity="0.08"/>
    <rect x="230" y="330" width="460" height="12" rx="6" fill="#111827" opacity="0.08"/>

    <g transform="translate(230 375)">
      <rect width="260" height="160" rx="14" fill="url(#gHero)" opacity="0.18"/>
      <path d="M 22 108 C 52 80, 86 124, 118 98 C 148 76, 172 44, 238 62" fill="none" stroke="#E11D48" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
      <circle cx="60" cy="80" r="10" fill="#E11D48" opacity="0.8"/>
      <circle cx="118" cy="98" r="10" fill="#FB7185" opacity="0.9"/>
      <circle cx="186" cy="54" r="10" fill="#F97316" opacity="0.9"/>
    </g>

    <g transform="translate(520 375)">
      <rect width="450" height="26" rx="13" fill="#111827" opacity="0.08"/>
      <rect y="44" width="390" height="14" rx="7" fill="#111827" opacity="0.06"/>
      <rect y="70" width="420" height="14" rx="7" fill="#111827" opacity="0.06"/>
      <rect y="96" width="360" height="14" rx="7" fill="#111827" opacity="0.06"/>

      <g transform="translate(0 132)">
        <rect width="150" height="38" rx="10" fill="url(#gHero)"/>
        <rect x="162" width="120" height="38" rx="10" fill="#FFFFFF" stroke="#E11D48"/>
      </g>
    </g>
